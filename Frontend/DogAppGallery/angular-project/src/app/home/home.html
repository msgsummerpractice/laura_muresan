<mat-toolbar-row>
  <div class="flex justify-end space-x-2 p-4">
    <a><button mat-button color="primary">Home</button></a>
    <a><button mat-button color="primary">Info</button></a>
    <button mat-button color="primary" routerLink="/login">
      <mat-icon>login</mat-icon>
    </button>
    <button mat-button color="primary">
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</mat-toolbar-row>

<section class="text-center py-12 bg-gray-50">
  <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl">Dog Gallery</h1>
  <p class="mt-3 text-lg text-gray-600 max-w-2xl mx-auto">Three very cute dogs !!</p>
</section>

<div class="max-w-6xl mx-auto p-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    @for (image of dogImages(); track $index) {
      <div class="bg-gray-100 rounded-lg shadow p-6">
        <img [src]="image" alt="Dog" class="w-full h-64 object-cover rounded" />
        <p class="text-gray-600 text-sm mt-2">A very cute dog.</p>
      </div>
    }
  </div>
  <button mat-raised-button color="primary" (click)="loadDogs()">Fetch Dog Images</button>
</div>
